<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>마이페이지 - 김치광장</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Noto Sans KR', sans-serif; background: #f5f5f5; color: #333; }
    .header { background: #fff; padding: 16px 40px; border-bottom: 1px solid #ddd; display: flex; align-items: center; justify-content: space-between; }
    .header .logo { font-size: 22px; font-weight: 700; color: #111; text-decoration: none; }
    .header .logout { font-size: 13px; color: #888; cursor: pointer; text-decoration: none; }
    .header .logout:hover { color: #e63312; }

    .container { max-width: 700px; margin: 36px auto; display: flex; flex-direction: column; gap: 20px; }

    .welcome-box {
      background: #222;
      color: #fff;
      border-radius: 12px;
      padding: 28px 32px;
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .avatar {
      width: 60px; height: 60px;
      background: #e63312;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 26px; font-weight: 700; color: #fff;
    }
    .welcome-box .info .name { font-size: 20px; font-weight: 700; }
    .welcome-box .info .sub { font-size: 13px; color: #aaa; margin-top: 4px; }

    .section {
      background: #fff;
      border-radius: 12px;
      padding: 28px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.06);
    }
    .section h2 { font-size: 16px; font-weight: 700; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 2px solid #222; }

    .order-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 0;
      border-bottom: 1px solid #f0f0f0;
    }
    .order-item:last-child { border-bottom: none; }
    .order-item img { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; }
    .order-item .info { flex: 1; }
    .order-item .info .name { font-size: 14px; font-weight: 700; }
    .order-item .info .date { font-size: 12px; color: #aaa; margin-top: 2px; }
    .order-item .info .price { font-size: 15px; font-weight: 700; color: #e63312; margin-top: 4px; }
    .order-item .status {
      font-size: 12px; font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      background: #e8f5e9;
      color: #2e7d32;
    }

    .menu-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .menu-item {
      border: 1px solid #eee;
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      text-decoration: none;
      color: #333;
      transition: all 0.2s;
    }
    .menu-item:hover { border-color: #222; background: #f9f9f9; }
    .menu-item .icon { font-size: 28px; margin-bottom: 8px; }
    .menu-item .label { font-size: 13px; font-weight: 700; }

    .btn-home {
      display: block; text-align: center;
      padding: 14px; background: #222; color: #fff;
      border-radius: 8px; text-decoration: none;
      font-weight: 700; font-size: 15px;
    }
    .btn-home:hover { background: #e63312; }
  </style>
</head>
<body>

  <div class="header">
    <a href="index.html" class="logo">김치광장</a>
    <a class="logout" onclick="doLogout()">로그아웃</a>
  </div>

  <div class="container">

    <!-- 환영 박스 -->
    <div class="welcome-box">
      <div class="avatar" id="avatarLetter">?</div>
      <div class="info">
        <div class="name" id="welcomeName">회원</div>
        <div class="sub">김치광장 회원이세요! 오늘도 좋은 하루 되세요.</div>
      </div>
    </div>

    <!-- 최근 주문 내역 -->
    <div class="section">
      <h2>최근 주문 내역</h2>
      <div class="order-item">
        <img src="https://img.freepik.com/free-photo/kimchi_1147-72.jpg" alt="포기김치">
        <div class="info">
          <div class="name">포기김치 3kg</div>
          <div class="date">2026-06-06</div>
          <div class="price">23,000원</div>
        </div>
        <span class="status">배송준비중</span>
      </div>
    </div>

    <!-- 메뉴 -->
    <div class="section">
      <h2>나의 메뉴</h2>
      <div class="menu-grid">
        <a href="#" class="menu-item">
          <div class="icon">📦</div>
          <div class="label">주문 내역</div>
        </a>
        <a href="#" class="menu-item">
          <div class="icon">❤️</div>
          <div class="label">찜 목록</div>
        </a>
        <a href="#" class="menu-item">
          <div class="icon">⭐</div>
          <div class="label">리뷰 관리</div>
        </a>
        <a href="#" class="menu-item">
          <div class="icon">📍</div>
          <div class="label">배송지 관리</div>
        </a>
        <a href="#" class="menu-item">
          <div class="icon">🎁</div>
          <div class="label">쿠폰함</div>
        </a>
        <a href="#" class="menu-item">
          <div class="icon">👤</div>
          <div class="label">회원정보 수정</div>
        </a>
      </div>
    </div>

    <a href="index.html" class="btn-home">쇼핑 계속하기</a>

  </div>

  <script>
    const name = localStorage.getItem('userName') || '회원';
    document.getElementById('welcomeName').textContent = name + '님';
    document.getElementById('avatarLetter').textContent = name.charAt(0).toUpperCase();

    function doLogout() {
      localStorage.removeItem('loggedIn');
      localStorage.removeItem('userName');
      alert('로그아웃 되었습니다.');
      location.href = 'index.html';
    }
  </script>

</body>
</html>
