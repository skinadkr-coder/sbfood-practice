<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입 - 김치광장</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Noto Sans KR', sans-serif; background: #f5f5f5; color: #333; }
    .header { background: #fff; padding: 16px 40px; border-bottom: 1px solid #ddd; }
    .header .logo { font-size: 22px; font-weight: 700; color: #111; text-decoration: none; display: inline-block; }

    .container {
      max-width: 480px;
      margin: 50px auto;
      background: #fff;
      border-radius: 12px;
      padding: 40px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    h1 { font-size: 24px; font-weight: 700; text-align: center; margin-bottom: 32px; }

    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; color: #555; margin-bottom: 6px; }
    .form-group label .required { color: #e63312; margin-left: 2px; }
    .form-group input, .form-group select {
      width: 100%; padding: 12px 14px;
      border: 1px solid #ddd; border-radius: 8px;
      font-size: 15px; font-family: 'Noto Sans KR', sans-serif;
    }
    .form-group input:focus, .form-group select:focus { outline: none; border-color: #222; }

    .btn-signup {
      width: 100%; padding: 14px;
      background: #e63312; color: #fff;
      font-size: 16px; font-weight: 700;
      border: none; border-radius: 8px;
      cursor: pointer; margin-top: 8px;
    }
    .btn-signup:hover { background: #c52a0e; }

    .login-link {
      text-align: center;
      margin-top: 16px;
      font-size: 14px;
      color: #888;
    }
    .login-link a { color: #333; font-weight: 700; text-decoration: none; }

    .divider { border: none; border-top: 1px solid #eee; margin: 20px 0; }
    .section-title { font-size: 14px; font-weight: 700; color: #888; margin-bottom: 14px; margin-top: 24px; }
  </style>
</head>
<body>

  <div class="header">
    <a href="index.html" class="logo">김치광장</a>
  </div>

  <div class="container">
    <h1>회원가입</h1>

    <div class="section-title">기본 정보</div>
    <div class="form-group">
      <label>이름 <span class="required">*</span></label>
      <input type="text" id="name" placeholder="이름을 입력하세요">
    </div>
    <div class="form-group">
      <label>이메일 <span class="required">*</span></label>
      <input type="email" id="email" placeholder="이메일을 입력하세요">
    </div>
    <div class="form-group">
      <label>비밀번호 <span class="required">*</span></label>
      <input type="password" id="password" placeholder="비밀번호 (8자 이상)">
    </div>
    <div class="form-group">
      <label>비밀번호 확인 <span class="required">*</span></label>
      <input type="password" id="password2" placeholder="비밀번호를 다시 입력하세요">
    </div>
    <div class="form-group">
      <label>휴대폰 번호 <span class="required">*</span></label>
      <input type="tel" id="phone" placeholder="010-0000-0000">
    </div>

    <hr class="divider">

    <button class="btn-signup" onclick="doSignup()">가입하기</button>

    <div class="login-link">
      이미 회원이신가요? <a href="login.html">로그인</a>
    </div>
  </div>

  <script>
    function doSignup() {
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const password2 = document.getElementById('password2').value;
      const phone = document.getElementById('phone').value.trim();

      if (!name) { alert('이름을 입력해주세요.'); return; }
      if (!email) { alert('이메일을 입력해주세요.'); return; }
      if (password.length < 8) { alert('비밀번호는 8자 이상이어야 합니다.'); return; }
      if (password !== password2) { alert('비밀번호가 일치하지 않습니다.'); return; }
      if (!phone) { alert('휴대폰 번호를 입력해주세요.'); return; }

      localStorage.setItem('loggedIn', 'true');
      localStorage.setItem('userName', name);
      alert(name + '님, 회원가입이 완료되었습니다!');
      location.href = 'mypage.html';
    }
  </script>

</body>
</html>
