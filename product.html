<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>포기김치 3kg - 김치광장</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Noto Sans KR', sans-serif; background: #f5f5f5; color: #333; }

    .header {
      background: #fff;
      padding: 16px 40px;
      border-bottom: 1px solid #ddd;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .header a { text-decoration: none; color: #333; font-size: 14px; }
    .header .logo { font-size: 22px; font-weight: 700; color: #111; }

    .container {
      max-width: 900px;
      margin: 40px auto;
      background: #fff;
      border-radius: 12px;
      padding: 40px;
      display: flex;
      gap: 48px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }

    .product-img {
      width: 360px;
      height: 360px;
      border-radius: 12px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .product-info { flex: 1; }
    .product-info h1 { font-size: 24px; font-weight: 700; margin-bottom: 12px; }

    .price-wrap { margin: 20px 0; }
    .price-original { font-size: 15px; color: #999; text-decoration: line-through; display: block; }
    .price-sale { font-size: 30px; font-weight: 700; color: #e63312; }
    .discount-badge {
      display: inline-block;
      background: #e63312;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
      margin-left: 8px;
      vertical-align: middle;
    }

    .divider { border: none; border-top: 1px solid #eee; margin: 20px 0; }

    .info-table { width: 100%; font-size: 14px; }
    .info-table tr td { padding: 6px 0; }
    .info-table tr td:first-child { color: #888; width: 90px; }

    .qty-wrap { display: flex; align-items: center; gap: 12px; margin: 24px 0; }
    .qty-wrap label { font-size: 14px; color: #888; width: 90px; }
    .qty-btn { width: 32px; height: 32px; border: 1px solid #ddd; background: #fff; font-size: 18px; cursor: pointer; border-radius: 4px; }
    .qty-input { width: 48px; text-align: center; border: 1px solid #ddd; height: 32px; font-size: 15px; border-radius: 4px; }

    .btn-wrap { display: flex; gap: 12px; margin-top: 24px; }
    .btn-cart {
      flex: 1; padding: 16px; border: 2px solid #222;
      background: #fff; font-size: 16px; font-weight: 700;
      cursor: pointer; border-radius: 8px; transition: background 0.2s;
    }
    .btn-cart:hover { background: #f0f0f0; }
    .btn-buy {
      flex: 1; padding: 16px; border: none;
      background: #222; color: #fff; font-size: 16px; font-weight: 700;
      cursor: pointer; border-radius: 8px; transition: background 0.2s;
    }
    .btn-buy:hover { background: #e63312; }

    .back-link { display: inline-block; margin-bottom: 20px; font-size: 14px; color: #666; text-decoration: none; }
    .back-link:hover { color: #333; }
  </style>
</head>
<body>

  <div class="header">
    <span class="logo">김치광장</span>
    <span style="color:#ddd">|</span>
    <a href="index.html">홈으로 돌아가기</a>
  </div>

  <div style="max-width:900px; margin: 20px auto 0; padding: 0 40px;">
    <a href="index.html" class="back-link">← 목록으로</a>
  </div>

  <div class="container">
    <img
      class="product-img"
      src="https://img.freepik.com/free-photo/kimchi_1147-72.jpg"
      alt="포기김치 3kg"
    >

    <div class="product-info">
      <h1>포기김치 3kg</h1>
      <p style="font-size:14px; color:#888;">국내산 100% 양은선 명품 포기김치</p>

      <div class="price-wrap">
        <span class="price-original">29,000원</span>
        <span class="price-sale">23,000원 <span class="discount-badge">21% 할인</span></span>
      </div>

      <hr class="divider">

      <table class="info-table">
        <tr><td>원산지</td><td>국내산 100%</td></tr>
        <tr><td>용량</td><td>3kg</td></tr>
        <tr><td>배송</td><td>무료배송 (냉장 직배송)</td></tr>
        <tr><td>배송기간</td><td>주문 후 1~2일 이내 출고</td></tr>
      </table>

      <hr class="divider">

      <div class="qty-wrap">
        <label>수량</label>
        <button class="qty-btn" onclick="changeQty(-1)">−</button>
        <input class="qty-input" type="number" id="qty" value="1" min="1">
        <button class="qty-btn" onclick="changeQty(1)">+</button>
      </div>

      <div class="btn-wrap">
        <button class="btn-cart" onclick="alert('장바구니에 담겼습니다!')">장바구니 담기</button>
        <button class="btn-buy" onclick="location.href='order.html'">바로 구매하기</button>
      </div>
    </div>
  </div>

  <script>
    function changeQty(val) {
      const input = document.getElementById('qty');
      const current = parseInt(input.value) || 1;
      const next = current + val;
      if (next >= 1) input.value = next;
    }
  </script>

</body>
</html>
